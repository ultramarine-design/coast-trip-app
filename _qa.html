<!doctype html><meta charset="utf-8"><body style="margin:0;display:flex;gap:8px;background:#888">
<script>
const seqs={home:[],day4:['.seg[data-d="4"]'],day6:['.seg[data-d="6"]','#nextD','#prevD'],check:['#chkBtn','input[data-id="r1"]'],appx:['#appxBtn']};
const errs=[];
for(const [k,s] of Object.entries(seqs)){
  const f=document.createElement('iframe');f.width=375;f.height=1400;f.style.border=0;f.src='index.html';
  document.body.appendChild(f);
  f.onload=()=>{f.contentWindow.onerror=(m)=>errs.push(k+': '+m);
    let i=0;const step=()=>{const d=f.contentDocument;
      if(i<s.length){const el=d.querySelector(s[i++]);if(!el)errs.push(k+': 없음 '+s[i-1]);else el.click();setTimeout(step,300);}
      else{const w=d.documentElement.scrollWidth;if(w>375)errs.push(k+': 가로넘침 '+w);document.title+=k+'='+d.querySelector('#sub').textContent+' | ';}};
    setTimeout(step,800);};
}
setTimeout(()=>{document.title+=' ERR:'+(errs.join(';')||'없음')},4000);
</script>
